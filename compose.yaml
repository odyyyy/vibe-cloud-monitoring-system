# Production-style local stack. Copy .env.example to .env before starting:
#   cp .env.example .env
#   docker compose up --build -d
#
# MySQL is intentionally not published to the host. For live-reload development use the
# override file:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build --watch -d

name: vibemonitoring

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      MONITORING_ALERTS_FRONTEND_BASE_URL: ${MONITORING_ALERTS_FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional agent profile. It reports to the backend over the Compose network and needs an
  # application API key created in the UI:
  #   AGENT_API_KEY=app_... docker compose --profile agent up -d agent
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    profiles:
      - agent
    restart: unless-stopped
    environment:
      AGENT_BACKEND_URL: http://backend:8080
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_INTERVAL_SECONDS: ${AGENT_INTERVAL_SECONDS:-15}
      AGENT_BUFFER_DIRECTORY: /var/lib/monitoring-agent/buffer
    volumes:
      - agent-buffer:/var/lib/monitoring-agent/buffer
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  agent-buffer:
