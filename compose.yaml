services:
  # База данных MySQL
  mysql:
    image: mysql:8.0
    container_name: monitoring-mysql
    env_file:
      - ./backend/.env
    command:
      - --default-authentication-plugin=mysql_native_password
      - --bind-address=0.0.0.0
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/mysql/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Твое Spring-приложение (основной API модуль)
  app:
    build:
      context: ./backend               # <-- Сборка из backend/
      dockerfile: Dockerfile
    container_name: monitoring-api
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    develop:
      watch:
        - path: pom.xml
          action: rebuild
        - path: monitoring-api/src
          action: rebuild
        - path: monitoring-api/pom.xml
          action: rebuild
        - path: monitoring-auth/src
          action: rebuild
        - path: monitoring-auth/pom.xml
          action: rebuild
        - path: .env
          action: restart

volumes:
  mysql-data:
