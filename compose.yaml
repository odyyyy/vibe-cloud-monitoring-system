services:
  mysql:
    image: mysql:8.0
    container_name: monitoring-mysql
    env_file:
      - ./backend/.env
    command:
      - --default-authentication-plugin=mysql_native_password
      - --bind-address=0.0.0.0
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/mysql/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-api
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/pom.xml
          action: rebuild
        - path: ./backend/monitoring-api/src
          action: rebuild
        - path: ./backend/monitoring-api/pom.xml
          action: rebuild
        - path: ./backend/monitoring-auth/src
          action: rebuild
        - path: ./backend/monitoring-auth/pom.xml
          action: rebuild
        - path: ./backend/monitoring-apps-management/src
          action: rebuild
        - path: ./backend/monitoring-apps-management/pom.xml
          action: rebuild
        - path: ./backend/monitoring-collector/src
          action: rebuild
        - path: ./backend/monitoring-collector/pom.xml
          action: rebuild
        - path: ./backend/monitoring-dashboards/src
          action: rebuild
        - path: ./backend/monitoring-dashboards/pom.xml
          action: rebuild
        - path: ./backend/.env
          action: restart

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: monitoring-agent
    profiles:
      - agent
    environment:
      - AGENT_BACKEND_URL=http://backend:8080
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_INTERVAL_SECONDS=${AGENT_INTERVAL_SECONDS:-15}
    depends_on:
      app:
        condition: service_started
    develop:
      watch:
        - path: ./agent
          action: rebuild

  # test:
  #   image: maven:3.9-eclipse-temurin-21
  #   working_dir: /app
  #   volumes:
  #     - ./backend:/app
  #     - maven-cache:/root/.m2
  #   env_file:
  #     - ./backend/.env
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   command: ["mvn", "test", "-B"]

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile.dev
      container_name: monitoring-frontend-dev
      ports:
        - "3000:3000"
        - "24678:24678"  # Vite HMR WebSocket port
      environment:
        - VITE_BACKEND_URL=http://backend:8080/api
        - CHOKIDAR_USEPOLLING=true
      volumes:
        - ./frontend:/app
        - /app/node_modules
      command: npm run dev
      develop:
        watch:
          - path: ./frontend/package.json
            action: rebuild
          - path: ./frontend/package-lock.json
            action: rebuild


volumes:
  mysql-data:
  maven-cache:
