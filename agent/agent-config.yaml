# Local agent configuration for the Docker quick-start.
#
# backend_url and api_key below are only placeholders: the AGENT_BACKEND_URL and
# AGENT_API_KEY environment variables override them at runtime, so this exact
# file can be reused on any machine without editing.
backend_url: "http://host.docker.internal:8080"
api_key: "REPLACE_WITH_YOUR_API_KEY"
interval_seconds: 15

# Log sources to tail. Paths are paths INSIDE the container, not on the host.
# Mount the host directory that holds the logs to /var/log/myapp (see README).
logs:
  - path: /var/log/myapp/app.log
    service_name: my-app
    format: auto

log_batch_size: 500
log_flush_seconds: 5
state_file: "/app/.agent_state.json"

# Pod log discovery. Not used by the plain `docker run` quick-start; the
# Kubernetes DaemonSet sets AGENT_KUBERNETES_ENABLED=true (see k8s/daemonset.yaml
# and the "Kubernetes" section in README.md). Namespace and selector can also be
# set with AGENT_KUBERNETES_NAMESPACE and AGENT_KUBERNETES_LABEL_SELECTOR.
kubernetes:
  enabled: false
  namespace: ""
  label_selector: ""

# Host metric collection. By default the agent reports physical interfaces
# only (eth*, ens*, enp*, wlan*) and skips loopback and virtual/bridge
# interfaces (lo, docker0, veth*, br-*). List interface names explicitly to
# override the selection, e.g. to include the loopback interface:
#
#   metrics:
#     network:
#       interfaces:
#         - eth0
#         - lo
metrics:
  network:
    interfaces: []

# Local custom metrics receiver. Disabled by default; binds to 127.0.0.1 only.
# When running the agent in a container, the application must share the agent's
# network namespace (for example, a Kubernetes sidecar) to reach this port.
receiver:
  enabled: false
  protocol: statsd
  port: 8125
