# Local agent configuration for the Docker quick-start.
#
# backend_url and api_key below are only placeholders: the AGENT_BACKEND_URL and
# AGENT_API_KEY environment variables override them at runtime, so this exact
# file can be reused on any machine without editing.
backend_url: "http://host.docker.internal:8080"
api_key: "REPLACE_WITH_YOUR_API_KEY"
interval_seconds: 15

# Log sources to tail. Paths are paths INSIDE the container, not on the host.
# Mount the host directory that holds the logs to /var/log/myapp (see README).
logs:
  - path: /var/log/myapp/app.log
    service_name: my-app

log_batch_size: 500
log_flush_seconds: 5
state_file: "/app/.agent_state.json"
