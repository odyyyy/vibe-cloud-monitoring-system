# Agent configuration.
# Never commit real credentials: keep api_key as a placeholder and override it
# in deployment via the AGENT_API_KEY environment variable.
backend_url: "http://localhost:8080"
api_key: "REPLACE_WITH_YOUR_API_KEY"
interval_seconds: 15

# Log collection. Each item tails exactly one file and forwards new lines to
# POST /api/v1/ingest/logs. Leave the list empty to disable log collection.
#
#   logs:
#     - path: /var/log/my-app/app.log     # exact file, never a directory
#       service_name: my-app              # optional; defaults to the file name
#       level_pattern: 'level=(\w+)'      # optional; first capture group is the level
#       format: auto                      # auto (default), json or text
#
# Batching: a batch is flushed every log_flush_seconds, or immediately once
# log_batch_size events are buffered (backend allows at most 1000 per request).
# state_file stores read offsets so collection resumes after a restart.
logs: []
log_batch_size: 500
log_flush_seconds: 5
state_file: ".agent_state.json"

# Kubernetes pod log discovery (optional). When enabled the agent watches pods
# and tails /var/log/containers/<pod>_<namespace>_<container>-<id>.log, adding
# k8s.pod.name, k8s.namespace and k8s.container.name to every event.
#
# Requires get/list/watch on pods (see k8s/rbac.yaml) and read-only access to
# /var/log/containers plus /var/log/pods (the log files are symlinks).
#
#   kubernetes:
#     enabled: true
#     namespace: ""                # empty or "all" = every namespace
#     label_selector: "app=api"    # optional; labelSelector also accepted
kubernetes:
  enabled: false
  namespace: ""
  label_selector: ""

# Host metric collection. By default the agent reports physical interfaces
# only (eth*, ens*, enp*, wlan*) and skips loopback and virtual/bridge
# interfaces (lo, docker0, veth*, br-*). List interface names explicitly to
# override the selection, e.g. to include the loopback interface:
#
#   metrics:
#     network:
#       interfaces:
#         - eth0
#         - lo
metrics:
  network:
    interfaces: []

# Local custom metrics receiver (optional). It binds strictly to 127.0.0.1 so
# only applications on the same host/container network namespace can send
# metrics. Protocol is "statsd" (UDP) or "http" (POST /metrics).
#
#   receiver:
#     enabled: true
#     protocol: statsd              # statsd (UDP) or http
#     port: 8125                    # default: 8125 for statsd, 8080 for http
receiver:
  enabled: false
  protocol: statsd
  port: 8125
