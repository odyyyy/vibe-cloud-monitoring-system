server:
  port: 8080

spring:
  application:
    name: monitoring-platform-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:monitoring;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      # Схема управляется только Flyway. Hibernate проверяет соответствие сущностей
      # реальной схеме и не изменяет её.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Миграции лежат в classpath:db/migration каждого модуля (V1..Vn на общем classpath).
    locations: classpath:db/migration
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console

# Профиль для разработки
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:monitoring;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console

# Настройки JWT
jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJwtTokenGenerationMustBeLongEnough1234567890!@#}
  expiration: ${JWT_EXPIRATION:86400000}

# Настройки для Docker HEALTHCHECK
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always