server:
  port: 8080
  error:
    # Never leak internals (stack traces, exception messages, binding details) to clients:
    # the API answers with the typed ApiError format instead.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: monitoring-platform-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:monitoring;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      # The schema is owned by Flyway. Hibernate only validates that the entities match
      # the real schema and never mutates it.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
  flyway:
    enabled: true
    # Migrations live in classpath:db/migration of each module (V1..Vn on the shared classpath).
    locations: classpath:db/migration
  h2:
    console:
      # Disabled by default: the database web console must not be reachable in production.
      enabled: ${SPRING_H2_CONSOLE_ENABLED:false}
      path: /h2-console

# JWT settings. The secret is mandatory (at least 32 characters) and is provided through
# the environment; the application refuses to start without it, so tokens are never signed
# with a publicly known key. The empty fallback lets JwtTokenProvider report a clear startup
# error instead of an unresolved-placeholder error.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# Email confirmation and password reset.
# Emails are not sent over SMTP yet: one-time links are written to the log only when
# app.auth.log-emails is enabled (never in production by default).
app:
  auth:
    verification-ttl: ${APP_AUTH_VERIFICATION_TTL:PT24H}
    reset-ttl: ${APP_AUTH_RESET_TTL:PT1H}
    verification-url: ${APP_AUTH_VERIFICATION_URL:http://localhost:3000/verify-email}
    reset-url: ${APP_AUTH_RESET_URL:http://localhost:3000/reset-password}
    log-emails: ${APP_AUTH_LOG_EMAILS:false}
    # Brute-force protection for password sign-in. Failed attempts are counted per identifier
    # and client IP; after max-attempts the pair is locked for lockout-base, doubling on each
    # consecutive lockout up to lockout-max. Set login-protection.enabled=false to disable.
    login-protection:
      enabled: ${APP_AUTH_LOGIN_PROTECTION_ENABLED:true}
      max-attempts: ${APP_AUTH_LOGIN_PROTECTION_MAX_ATTEMPTS:5}
      failure-window: ${APP_AUTH_LOGIN_PROTECTION_FAILURE_WINDOW:PT15M}
      lockout-base: ${APP_AUTH_LOGIN_PROTECTION_LOCKOUT_BASE:PT1M}
      lockout-max: ${APP_AUTH_LOGIN_PROTECTION_LOCKOUT_MAX:PT15M}
      max-tracked-keys: ${APP_AUTH_LOGIN_PROTECTION_MAX_TRACKED_KEYS:100000}
  # Single sign-on through an OpenID Connect provider. Disabled by default: the platform then
  # depends on no external identity provider and local password login is the only option.
  # Enabling it requires an HTTPS issuer (http is only accepted for a localhost issuer).
  sso:
    enabled: ${APP_SSO_ENABLED:false}
    registration-id: ${APP_SSO_REGISTRATION_ID:sso}
    issuer-uri: ${APP_SSO_ISSUER_URI:}
    client-id: ${APP_SSO_CLIENT_ID:}
    client-secret: ${APP_SSO_CLIENT_SECRET:}
    role-claim: ${APP_SSO_ROLE_CLAIM:groups}
    # Claim value -> platform role (OWNER, ADMIN, VIEWER). Values not listed default to VIEWER.
    role-mapping: {}
    default-role: ${APP_SSO_DEFAULT_ROLE:VIEWER}
    success-redirect-url: ${APP_SSO_SUCCESS_REDIRECT_URL:http://localhost:3000/sso/callback}
    failure-redirect-url: ${APP_SSO_FAILURE_REDIRECT_URL:http://localhost:3000/login}

# Background telemetry maintenance (downsampling of raw metrics and per-organization retention).
# Each job can be disabled independently; retention windows are in days.
monitoring:
  # Platform self-monitoring (dogfooding). Samples are written through the regular metric
  # ingestion pipeline into a hidden system application every interval.
  platform-metrics:
    enabled: ${MONITORING_PLATFORM_METRICS_ENABLED:true}
    interval-ms: ${MONITORING_PLATFORM_METRICS_INTERVAL_MS:60000}
    initial-delay-ms: ${MONITORING_PLATFORM_METRICS_INITIAL_DELAY_MS:30000}
  # Platform administration. The account with this username is promoted to PLATFORM_ADMIN on
  # startup; the role is not assignable through the organization member API, because it grants
  # access to internal platform telemetry. Empty (the default) means there is no platform
  # administrator and the platform health dashboard stays unreachable.
  platform-admin:
    username: ${MONITORING_PLATFORM_ADMIN_USERNAME:}
    # How often the configured account is re-checked (the account may be created after startup).
    sync-interval-ms: ${MONITORING_PLATFORM_ADMIN_SYNC_INTERVAL_MS:300000}
  downsample:
    enabled: ${MONITORING_DOWNSAMPLE_ENABLED:true}
    # Hourly, at minute 5.
    cron: ${MONITORING_DOWNSAMPLE_CRON:0 5 * * * *}
    # Raw samples older than this window are aggregated into hourly buckets, then deleted.
    raw-retention-hours: ${MONITORING_DOWNSAMPLE_RAW_RETENTION_HOURS:24}
    # Upper bound on rows deleted per statement (short transactions, no table-wide lock).
    batch-size: ${MONITORING_DOWNSAMPLE_BATCH_SIZE:10000}
  # Per-organization retention of logs, metrics and traces. An organization without a stored
  # policy uses the defaults below. The max-*-days values are hard API limits, not defaults.
  retention:
    enabled: ${MONITORING_RETENTION_ENABLED:true}
    # Hourly, at minute 0.
    cron: ${MONITORING_RETENTION_CRON:0 0 * * * *}
    default-logs-days: ${MONITORING_RETENTION_DEFAULT_LOGS_DAYS:14}
    default-metrics-days: ${MONITORING_RETENTION_DEFAULT_METRICS_DAYS:30}
    default-traces-days: ${MONITORING_RETENTION_DEFAULT_TRACES_DAYS:7}
    max-logs-days: ${MONITORING_RETENTION_MAX_LOGS_DAYS:90}
    max-metrics-days: ${MONITORING_RETENTION_MAX_METRICS_DAYS:365}
    max-traces-days: ${MONITORING_RETENTION_MAX_TRACES_DAYS:30}
    # Upper bound on rows deleted per statement (short transactions, no table-wide lock).
    batch-size: ${MONITORING_RETENTION_BATCH_SIZE:5000}
    # Upper bound on batches processed per organization and data type per run.
    max-batches-per-run: ${MONITORING_RETENTION_MAX_BATCHES_PER_RUN:100}
  # Per-application ingestion rate limits (requests per minute), enforced per API key and
  # separately for metrics and logs. Set monitoring.quotas.enabled=false to disable.
  quotas:
    enabled: ${MONITORING_QUOTAS_ENABLED:true}
    metrics-per-minute: ${MONITORING_QUOTAS_METRICS_PER_MINUTE:10000}
    logs-per-minute: ${MONITORING_QUOTAS_LOGS_PER_MINUTE:5000}
  # Log facets (Top-N aggregation). The aggregation is more expensive than a normal log query:
  # the JSON context fields are counted over the most recent max-scan-rows matching rows, the
  # statement timeout aborts a run that takes too long, and the requests are rate limited per
  # organization.
  logs:
    facets:
      max-scan-rows: ${MONITORING_LOGS_FACETS_MAX_SCAN_ROWS:50000}
      timeout-ms: ${MONITORING_LOGS_FACETS_TIMEOUT_MS:2000}
      max-requests: ${MONITORING_LOGS_FACETS_MAX_REQUESTS:30}
      window-seconds: ${MONITORING_LOGS_FACETS_WINDOW_SECONDS:60}
  # Usage tracking and quota visualization. The rollup job recomputes daily per-organization
  # telemetry totals; it can be disabled with monitoring.usage.enabled=false. Quotas are the
  # monthly plan limits shown on the Usage page (items per calendar month, UTC).
  usage:
    enabled: ${MONITORING_USAGE_ENABLED:true}
    # Hourly, at minute 10 (rolls up today and yesterday).
    cron: ${MONITORING_USAGE_CRON:0 10 * * * *}
    metrics-quota: ${MONITORING_USAGE_METRICS_QUOTA:10000000}
    logs-quota: ${MONITORING_USAGE_LOGS_QUOTA:5000000}
    traces-quota: ${MONITORING_USAGE_TRACES_QUOTA:1000000}
  # Alert evaluation. The scheduler is enabled by default and can be disabled with
  # monitoring.alerts.scheduler.enabled=false (for example in tests or single-shot environments).
  alerts:
    scheduler:
      enabled: ${MONITORING_ALERTS_SCHEDULER_ENABLED:true}
    scheduler-interval-ms: ${MONITORING_ALERTS_SCHEDULER_INTERVAL_MS:60000}
    metric-lookback-minutes: ${MONITORING_ALERTS_METRIC_LOOKBACK_MINUTES:5}
    health-freshness-minutes: ${MONITORING_ALERTS_HEALTH_FRESHNESS_MINUTES:10}
    evaluation-pool-size: ${MONITORING_ALERTS_EVALUATION_POOL_SIZE:4}
    evaluation-queue-capacity: ${MONITORING_ALERTS_EVALUATION_QUEUE_CAPACITY:100}
    evaluation-timeout-ms: ${MONITORING_ALERTS_EVALUATION_TIMEOUT_MS:120000}
    # Log-count preview is a read-only, tenant-scoped COUNT query; bound its cost per organization.
    preview:
      max-requests: ${MONITORING_ALERTS_PREVIEW_MAX_REQUESTS:30}
      window-seconds: ${MONITORING_ALERTS_PREVIEW_WINDOW_SECONDS:60}
    # Customer-facing base URL used to build Log Explorer links in notifications.
    # Leave blank in local development to omit the link instead of emitting localhost URLs.
    frontend:
      base-url: ${MONITORING_ALERTS_FRONTEND_BASE_URL:}
    webhook:
      pool-size: ${MONITORING_ALERTS_WEBHOOK_POOL_SIZE:2}
      queue-capacity: ${MONITORING_ALERTS_WEBHOOK_QUEUE_CAPACITY:100}
      connect-timeout-ms: ${MONITORING_ALERTS_WEBHOOK_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${MONITORING_ALERTS_WEBHOOK_REQUEST_TIMEOUT_MS:10000}
    slack:
      connect-timeout-ms: ${MONITORING_ALERTS_SLACK_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${MONITORING_ALERTS_SLACK_REQUEST_TIMEOUT_MS:10000}
    # Email is sent asynchronously on a dedicated bounded executor.
    # To enable the EMAIL channel, configure Spring's mail support (for example via
    # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
    # Without spring.mail.host no JavaMailSender bean exists and email delivery fails fast.
    email:
      pool-size: ${MONITORING_ALERTS_EMAIL_POOL_SIZE:1}
      queue-capacity: ${MONITORING_ALERTS_EMAIL_QUEUE_CAPACITY:100}
      from: ${MONITORING_ALERTS_EMAIL_FROM:no-reply@vibemonitoring.local}
    # Minimum time between two notifications for the same rule and channel (spam prevention).
    notifications:
      min-interval-seconds: ${MONITORING_ALERTS_NOTIFICATIONS_MIN_INTERVAL_SECONDS:900}

# Actuator. Only health and Prometheus endpoints are exposed. Health details are hidden
# from anonymous clients; the dev profile shows them. Kubernetes-style liveness and
# readiness probes are enabled separately: readiness includes database connectivity, so a
# lost MySQL connection turns the readiness probe DOWN while the process stays alive.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db
          show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

# Local development profile.
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:monitoring;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console

app:
  auth:
    # Local development: log one-time links instead of sending real email.
    log-emails: ${APP_AUTH_LOG_EMAILS:true}

management:
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          show-details: always
        readiness:
          show-details: always

---
# Production profile. Required secrets are validated at startup by ProdSecretValidator:
# missing, weak or example JWT secrets fail fast instead of silently signing real tokens.
spring:
  config:
    activate:
      on-profile: prod

management:
  endpoint:
    health:
      show-details: never
