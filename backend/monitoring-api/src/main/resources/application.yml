server:
  port: 8080

spring:
  application:
    name: monitoring-platform-api
  datasource:
    # Пока используем H2 для быстрого старта. 
    # Позже заменишь на: jdbc:mysql://localhost:3306/monitoring_db
    url: jdbc:h2:mem:monitoring
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update # Для продакшена сменить на 'validate' или использовать Flyway/Liquibase
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Настройки JWT (обязательно должны быть здесь, чтобы их видел модуль auth)
jwt:
  secret: mySuperSecretKeyForJwtTokenGenerationMustBeLongEnough1234567890!@#
  expiration: 86400000

# Настройки для Docker HEALTHCHECK (из твоего Dockerfile)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always