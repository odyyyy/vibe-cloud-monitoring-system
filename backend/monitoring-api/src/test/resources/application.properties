# Test-only configuration merged over the main application.yml.
# A real HS256 secret (>= 32 bytes) is required because the application has no insecure default.
jwt.secret=integration-test-only-secret-key-please-do-not-use-32b

# The self-monitoring scheduler must not write into test databases between assertions.
monitoring.platform-metrics.enabled=false

# The hourly retention purge must not delete seeded telemetry between assertions.
monitoring.retention.enabled=false
