# Test-only configuration for the collector module.
# The integration test runs against the real Flyway migrations (classpath:db/migration) on
# H2 in MySQL mode; Hibernate only validates the entities against the migrated schema, so
# schema changes such as the metric_aggregates table are exercised without monitoring-api.
spring.datasource.url=jdbc:h2:mem:collector-maintenance;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# The maintenance jobs must not fire during tests.
monitoring.downsample.enabled=false
monitoring.retention.enabled=false
monitoring.usage.enabled=false

# monitoring-auth is on the test classpath, so its JWT beans are created and require a secret.
jwt.secret=collector-test-secret-key-at-least-32-characters

