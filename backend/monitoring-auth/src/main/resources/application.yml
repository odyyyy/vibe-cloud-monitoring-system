server:
  port: 8081 # Отличный от API порт, чтобы не было конфликтов при изолированном запуске

spring:
  application:
    name: monitoring-auth
  datasource:
    # H2 для быстрой проверки работы auth-модуля в изоляции
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Настройки JWT (используются классом JwtTokenProvider)
jwt:
  # Секрет должен быть минимум 256 бит (32 символа) для алгоритма HS256
  secret: mySuperSecretKeyForJwtTokenGenerationMustBeLongEnough1234567890!@#
  expiration: 86400000       # 24 часа в миллисекундах
  refresh-expiration: 604800000 # 7 дней (задел на будущее)

logging:
  level:
    com.monitoring.auth: DEBUG
    org.springframework.security: DEBUG