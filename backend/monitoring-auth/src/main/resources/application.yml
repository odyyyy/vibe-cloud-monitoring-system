server:
  port: 8081 # Отличный от API порт, чтобы не было конфликтов при изолированном запуске

spring:
  application:
    name: monitoring-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:monitoring}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    hikari:
      connection-timeout: 120000
      connection-test-query: SELECT 1
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Настройки JWT (используются классом JwtTokenProvider)
jwt:
  # Секрет должен быть минимум 256 бит (32 символа) для алгоритма HS256
  secret: ${JWT_SECRET:mySuperSecretKeyForJwtTokenGenerationMustBeLongEnough1234567890!@#}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    com.monitoring.auth: DEBUG
    org.springframework.security: DEBUG